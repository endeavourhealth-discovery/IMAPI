spring.jackson.default-property-inclusion=non_null
# Casdoor access tokens carry the whole user (roles, properties), so the Authorization header can exceed Tomcat's 8KB default.
# Override per environment with SERVER_MAX_HTTP_REQUEST_HEADER_SIZE.
server.max-http-request-header-size=32KB

# Compress large JSON/text responses (TripleTree bundles, search results). Harmless if a proxy also compresses.
server.compression.enabled=true
server.compression.mime-types=application/json,application/ld+json,application/xml,text/plain,text/html,text/css,application/javascript
server.compression.min-response-size=2KB
